<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star City Cup Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: a plain tour-style points list. White page, black type, hairline rows; color only for movement. */
:root {
  --bg: #ffffff;
  --ink: #111418;
  --muted: #646b73;
  --line: #e3e5e8;
  --soft: #f4f5f7;
  --up: #0f7b3f;
  --down: #c62828;
  --accent: #0b2f5b;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); }
.wrap { max-width: 1000px; margin: 0 auto; padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 6px 24px; padding-bottom: 14px; border-bottom: 3px solid var(--ink); }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.logo { width: 72px; height: auto; flex: none; }
h1 { margin: 0; font: 700 clamp(30px, 6vw, 44px)/1 var(--display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.meta { color: var(--muted); font-size: 14px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 14px 0; }
.tools input { font: inherit; font-size: 15px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); color: var(--ink); width: min(280px, 100%); }
.tools input:focus-visible, tr.p:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.notice { margin: 0 0 12px; padding: 10px 14px; background: var(--soft); border-left: 3px solid var(--accent); font-size: 14px; color: var(--ink); }
.notice b { font-weight: 600; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font: 600 12px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 10px 10px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
th.l, td.l { text-align: left; }
td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
tr.p { cursor: pointer; }
tr.p:hover, tr.p.open { background: var(--soft); }
td.pos { font-weight: 700; width: 3.2em; }
td.mv { width: 3.6em; font-size: 13px; font-weight: 600; text-align: left; }
.up { color: var(--up); } .down { color: var(--down); } .same { color: var(--muted); font-weight: 400; }
td.name { font-weight: 600; white-space: normal; }
td.tot { font-weight: 700; font-size: 17px; }
td.back, td.cat { color: var(--muted); }
.chev { display: inline-block; width: .9em; color: var(--muted); font-weight: 400; transition: transform .15s; }
tr.open .chev { transform: rotate(90deg); }
tr.detail > td { padding: 0; background: var(--soft); text-align: left; white-space: normal; }
.card { padding: 6px 16px 18px 46px; display: grid; gap: 16px; }
.label { font: 600 12px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.dist { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; color: var(--muted); }
.dist b { color: var(--ink); font-weight: 600; }
.ev { width: 100%; font-size: 14px; background: var(--bg); border: 1px solid var(--line); }
.ev th { font-size: 11px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--bg); }
.ev td { padding: 8px 10px; white-space: normal; text-align: left; vertical-align: top; }
.ev td.r { text-align: right; white-space: nowrap; font-weight: 600; }
.ev tr:last-child td { border-bottom: 0; }
.ev em { color: var(--muted); white-space: nowrap; }
.tag { display: inline-block; margin-left: 6px; padding: 1px 6px; border: 1px solid var(--accent); color: var(--accent); border-radius: 2px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; vertical-align: 1px; }
.dropped { color: var(--muted); text-decoration: line-through; font-weight: 400; }
.sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.empty { padding: 28px 0; color: var(--muted); }
.foot { padding-top: 14px; color: var(--muted); font-size: 13px; }
@media (max-width: 760px) {
  .logo { width: 52px; }
  .brand { gap: 12px; }
  .cat { display: none; }
  td, th { padding-left: 6px; padding-right: 6px; }
  .card { padding: 6px 8px 16px; }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
</head>

  var d = p.last - p.pos;
  if (d > 0) return '<td class="mv l up" title="Up ' + d + ' since last week">▲' + d + "</td>";
  if (d < 0) return '<td class="mv l down" title="Down ' + -d + ' since last week">▼' + -d + "</td>";
  return '<td class="mv l"><span class="same">–</span></td>';
}

function detail(p) {
  var dist = CATS.map(function (c) { return "<span>" + esc(c[1]) + " <b>" + fmt(p.cats[c[0]] || 0) + "</b></span>"; }).join("");
  var rows = p.events.map(function (e) {
    var dropped = e.type === "OHW" && e.cup === 0 && e.pts > 0;
    var name = esc(eventName(e)) + (e.projected ? '<span class="tag">Projected</span>' : "") +
      (e.team ? '<span class="sub">' + esc(e.team) + "</span>" : "");
    var pts = dropped ? '<span class="dropped">' + fmt(e.pts) + '</span><span class="sub">not in best 12</span>' : fmt(e.cup);
    return "<tr><td>" + name + "</td><td>" + resultText(e) + '</td><td class="r">' + pts + "</td></tr>";
  }).join("");
  return '<div class="card"><div><p class="label">Points Awarded</p><div class="dist">' + dist + "</div></div>" +
    '<table class="ev"><thead><tr><th class="l">Event</th><th class="l">Result</th><th>Points</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
}

var model = { list: [], hasLast: false };

function render() {
  var q = document.getElementById("q").value.trim().toLowerCase();
  var shown = model.list.filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) >= 0; });
  document.getElementById("rows").innerHTML = shown.map(function (p) {
    var open = openPlayers[p.name];
    var cats = CATS.map(function (c) { return '<td class="cat">' + fmt(p.cats[c[0]] || 0) + "</td>"; }).join("");
    return '<tr class="p' + (open ? " open" : "") + '" tabindex="0" aria-expanded="' + !!open + '" data-name="' + esc(p.name) + '">' +
      '<td class="pos l">' + (p.tied ? "T" : "") + p.pos + "</td>" + moveCell(p, model.hasLast) +
      '<td class="name l"><span class="chev">›</span> ' + esc(p.name) + "</td>" +
      '<td class="tot">' + fmt(p.total) + '</td><td class="back">' + (p.back ? "−" + fmt(p.back) : "–") + "</td>" + cats + "</tr>" +
      (open ? '<tr class="detail"><td colspan="10">' + detail(p) + "</td></tr>" : "");
  }).join("");
  var empty = document.getElementById("empty");
  empty.hidden = shown.length > 0;
  empty.textContent = model.list.length ? "No player matches that name." : "No results yet. Standings appear after the first event is entered.";
  sendHeight();
}

function show(text, demo) {
  var results = parseCSV(text);
  model = build(results);
  document.getElementById("demo").hidden = !demo;
  var projected = {}, latest = null, latestOhw = null;
  results.forEach(function (r) {
    if (r["Type"] === "Last week" || num(r["Cup Points"]) === null) return;
    if (r["Status"] === "Projected") projected[r["Event"]] = 1;
    var d = toDate(r["Date"]); if (!d) return;
    if (r["Status"] !== "Projected" && (!latest || d > latest)) latest = d;
    if (r["Type"] === "OHW" && (!latestOhw || d > latestOhw)) latestOhw = d;
  });
  var thru = latestOhw || latest;
  document.getElementById("meta").textContent = thru ? "Through " + shortDate(thru) : "";
  document.getElementById("count").textContent = model.list.length + " players";
  var names = Object.keys(projected), note = document.getElementById("proj");
  note.hidden = !names.length;
  if (names.length) {
    var list = names.length === 1 ? names[0] : names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
    note.innerHTML = "<b>Projected standings.</b> " + esc(list) + (names.length === 1 ? " is" : " are") +
      " still being played, so those points are based on the current leaderboard and will change until " + (names.length === 1 ? "it's" : "they're") + " final.";
  }
  render();
}

function load() {
  var url = SHEET_CSV_URL;
  try { var u = new URLSearchParams(location.search).get("csv"); if (u) url = u; } catch (e) {}
  if (!url) { show(SAMPLE_CSV, true); return; }
  fetch(url, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (t) { show(t, false); })
    .catch(function () { document.getElementById("meta").textContent = "Couldn't load the standings. Check that the Web Feed tab is still published to the web."; });
}

function sendHeight() {
  try { if (window.parent !== window) window.parent.postMessage({ starCityCupHeight: document.documentElement.scrollHeight }, "*"); } catch (e) {}
}

function toggle(tr) { var n = tr.getAttribute("data-name"); openPlayers[n] = !openPlayers[n]; render(); }
document.getElementById("rows").addEventListener("click", function (e) { var tr = e.target.closest("tr.p"); if (tr) toggle(tr); });
document.getElementById("rows").addEventListener("keydown", function (e) {
  var tr = e.target.closest("tr.p"); if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(tr); }
});
document.getElementById("q").addEventListener("input", render);
window.addEventListener("resize", sendHeight);
load();
</script>
</body>
</html>
